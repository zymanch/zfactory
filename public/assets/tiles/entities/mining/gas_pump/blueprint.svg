<svg opacity="0.6" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Base -->
  <rect x="8" y="40" width="48" height="16" fill="#5A5A5A" stroke="#3A3A3A" stroke-width="2"/>

  <!-- Pump body -->
  <rect x="16" y="16" width="32" height="32" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2"/>

  <!-- Pipe connection at top -->
  <rect x="26" y="8" width="12" height="12" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1"/>

  <!-- Pipe connection at bottom -->
  <rect x="26" y="48" width="12" height="8" fill="#5A5A5A" stroke="#3A3A3A" stroke-width="1"/>

  <!-- Gas indicator (cloud-like) -->
  <ellipse cx="28" cy="26" rx="6" ry="4" fill="#BDC3C7" opacity="0.6"/>
  <ellipse cx="36" cy="28" rx="6" ry="4" fill="#BDC3C7" opacity="0.6"/>
  <ellipse cx="32" cy="30" rx="5" ry="3" fill="#BDC3C7" opacity="0.6"/>

  <!-- Details -->
  <line x1="20" y1="20" x2="20" y2="44" stroke="#7F8C8D" stroke-width="1"/>
  <line x1="44" y1="20" x2="44" y2="44" stroke="#7F8C8D" stroke-width="1"/>
  <rect x="0" y="0" width="64" height="64" fill="#3498DB" opacity="0.2"/>
</svg>
