<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Iron rod - long vertical bar -->
  <rect x="6.5" y="1" width="3" height="14" fill="#6B6B6B"/>
  <!-- Highlight on left side -->
  <rect x="6.5" y="1" width="1" height="14" fill="#8B8B8B"/>
  <!-- Shadow on right side -->
  <rect x="8.5" y="1" width="1" height="14" fill="#4A4A4A"/>
  <!-- Top end cap -->
  <ellipse cx="8" cy="1.5" rx="1.5" ry="1" fill="#7B7B7B"/>
  <!-- Bottom end cap -->
  <ellipse cx="8" cy="14.5" rx="1.5" ry="1" fill="#5A5A5A"/>
</svg>
