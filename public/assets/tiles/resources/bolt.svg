<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Bolt - hexagonal head with threaded shaft -->
  <!-- Hexagonal head -->
  <polygon points="8,2 10,3 10,5 8,6 6,5 6,3" fill="#6B6B6B"/>
  <polygon points="8,2 10,3 10,5 8,6" fill="#5A5A5A"/>
  <polygon points="6,3 8,2 10,3 8,3.5" fill="#8B8B8B"/>

  <!-- Threaded shaft -->
  <rect x="7" y="6" width="2" height="8" fill="#5A5A5A"/>
  <rect x="7" y="6" width="1" height="8" fill="#6B6B6B"/>

  <!-- Thread lines -->
  <line x1="6.5" y1="7" x2="9.5" y2="7" stroke="#4A4A4A" stroke-width="0.5"/>
  <line x1="6.5" y1="9" x2="9.5" y2="9" stroke="#4A4A4A" stroke-width="0.5"/>
  <line x1="6.5" y1="11" x2="9.5" y2="11" stroke="#4A4A4A" stroke-width="0.5"/>
  <line x1="6.5" y1="13" x2="9.5" y2="13" stroke="#4A4A4A" stroke-width="0.5"/>

  <!-- Pointed tip -->
  <polygon points="7,14 8,15 9,14" fill="#4A4A4A"/>
</svg>
