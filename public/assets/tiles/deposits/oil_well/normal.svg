<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground/base -->
  <ellipse cx="32" cy="56" rx="28" ry="8" fill="#5A4A3A" opacity="0.6"/>

  <!-- Oil pool -->
  <ellipse cx="32" cy="52" rx="24" ry="6" fill="#1A1A1A"/>
  <ellipse cx="32" cy="52" rx="20" ry="5" fill="#2C2C2C" opacity="0.8"/>

  <!-- Derrick/well structure -->
  <rect x="28" y="20" width="8" height="32" fill="#8B7355" stroke="#5A4A3A" stroke-width="1"/>

  <!-- Well top -->
  <rect x="24" y="16" width="16" height="6" fill="#6A5345" stroke="#4A3A2A" stroke-width="1"/>

  <!-- Pipe/drill -->
  <rect x="30" y="22" width="4" height="30" fill="#4A4A4A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Oil drops -->
  <circle cx="28" cy="48" r="2" fill="#0A0A0A"/>
  <circle cx="36" cy="50" r="2" fill="#0A0A0A"/>
  <circle cx="32" cy="46" r="2.5" fill="#0A0A0A"/>

  <!-- Bubbles in oil -->
  <circle cx="26" cy="52" r="1.5" fill="#3A3A3A" opacity="0.5"/>
  <circle cx="38" cy="51" r="1.5" fill="#3A3A3A" opacity="0.5"/>

  <!-- Metal details -->
  <line x1="26" y1="18" x2="26" y2="48" stroke="#5A4A3A" stroke-width="1"/>
  <line x1="38" y1="18" x2="38" y2="48" stroke="#5A4A3A" stroke-width="1"/>
</svg>
